<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pathways · Advisor inbox</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/schibstedgrotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/advisor.css">
  <script type="module" src="/advisor.js"></script>
</head>
<body data-screen="inbox" data-view="list">
  <main id="app" class="inbox">
    <nav class="topbar">
      <a class="wordmark ink" href="/">Pathways</a>
      <a class="link" href="/">Back to the planner</a>
    </nav>

    <div id="inbox" class="panes">
      <section class="list-pane" aria-labelledby="inbox-title">
        <h1 id="inbox-title">Inbox</h1>
        <ul id="requests" class="requests"></ul>
      </section>
      <section id="detail" class="detail-pane" aria-live="polite"></section>
    </div>
  </main>

  <footer class="site-footer">
    <p class="demo">Demo: synthetic students and requests.</p>
  </footer>
</body>
</html>
